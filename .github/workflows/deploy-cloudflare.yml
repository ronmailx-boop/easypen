# Deploys the app to Cloudflare Workers (static assets, see wrangler.jsonc) on every push to main.
# Needs the repository secret CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers").
# Optional: PLAY_SERVICE_ACCOUNT (Google Play service account JSON), copied to the Worker.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1c9c1dd0e8a1d80f324b974ae6a617fb
    steps:
      - name: Check for API token
        id: token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN secret is not set - skipping deploy."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'

      - uses: actions/setup-node@v4
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 22

      - name: Deploy
        if: steps.token.outputs.present == 'true'
        run: npx --yes wrangler@4 deploy

      # The Google Play service account (JSON) for /api/play/verify: kept as the GitHub secret
      # PLAY_SERVICE_ACCOUNT and copied to the Worker's secret of the same name
      - name: Worker secret for Google Play
        if: steps.token.outputs.present == 'true'
        env:
          PLAY_SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT" ]; then
            echo "::notice::PLAY_SERVICE_ACCOUNT secret is not set - purchases can't be verified yet."
            exit 0
          fi
          printf '%s' "$PLAY_SERVICE_ACCOUNT" | npx --yes wrangler@4 secret put PLAY_SERVICE_ACCOUNT
