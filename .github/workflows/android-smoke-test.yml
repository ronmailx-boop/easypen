# Installs the Android app on an emulator, opens it and prints the crash log, if any
# (Actions → "Android - smoke test" → Run workflow). Signed with a throwaway key: only for testing.
name: Android - smoke test
on:
  workflow_dispatch:
  push:
    branches: ['ccr-*']
    paths: ['android/**', '.github/workflows/android-smoke-test.yml']
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Build the release APK
        working-directory: android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" > /dev/null
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -q
      - name: Sign with a throwaway key
        run: |
          T="$ANDROID_HOME/build-tools/35.0.0"
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore t.p12 -alias t -keyalg RSA -keysize 2048 -validity 1 -dname CN=t -storepass testtest -keypass testtest
          "$T/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk a.apk
          "$T/apksigner" sign --ks t.p12 --ks-pass pass:testtest --out app.apk a.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Open the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r app.apk
            adb logcat -c
            adb shell monkey -p app.vplusstudio.easypen -c android.intent.category.LAUNCHER 1
            sleep 20
            echo "===== crash / app log ====="
            adb logcat -d | grep -E "AndroidRuntime|FATAL|easypen|TWA|TrustedWeb|androidbrowserhelper|Process: |Caused by|at com\.|at app\.|at android\." | head -150 || true
            echo "===== top activity ====="
            adb shell dumpsys activity activities | grep -E "topResumedActivity|mResumedActivity" | head -5 || true
