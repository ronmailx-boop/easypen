# Builds the Android app (android/, a Trusted Web Activity of easypen.vplusstudio.app) as an
# .aab for Google Play: Actions → "Android - build" → Run workflow. The result is the
# "easypen-aab" artifact, ready to upload in Play Console.
#
# Signs with the upload key from the secrets ANDROID_KEYSTORE_BASE64 + ANDROID_KEYSTORE_PASSWORD
# (see android-upload-key.yml). Without them it still builds, unsigned, to check the project.
# The website itself needs no new build: the app shows the live site.
name: Android - build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/build-android.yml']
concurrency:
  group: build-android
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" > /dev/null
      - name: Build the app bundle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace
      - name: Sign with the upload key
        id: sign
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          VERSION=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          CODE=$(grep -oP 'versionCode \K[0-9]+' android/app/build.gradle)
          OUT="easypen-$VERSION-$CODE.aab"
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ]; then
            echo "::warning::No upload key in the secrets - the bundle is NOT signed (Play Console will refuse it)."
            cp "$AAB" "unsigned-$OUT"
            echo "file=unsigned-$OUT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.p12"
          jarsigner -keystore "$RUNNER_TEMP/upload.p12" -storetype PKCS12 -storepass:env STORE_PASSWORD \
            -sigalg SHA256withRSA -digestalg SHA-256 -signedjar "$OUT" "$AAB" upload
          jarsigner -verify "$OUT" | tail -1
          echo "Upload key SHA-256 fingerprint:"
          keytool -list -v -keystore "$RUNNER_TEMP/upload.p12" -alias upload -storepass:env STORE_PASSWORD | grep "SHA256:"
          rm -f "$RUNNER_TEMP/upload.p12"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: easypen-aab
          path: ${{ steps.sign.outputs.file }}
          retention-days: 14
